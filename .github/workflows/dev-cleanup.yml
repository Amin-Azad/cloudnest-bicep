name: Dev Cleanup

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DELETE-PORTFOLIO
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudnest-dev-deployment
  cancel-in-progress: false

jobs:
  cleanup:
    name: Guarded CloudNest Cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment:
      name: dev

    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      CLOUDNEST_DEPLOYMENT_RESOURCE_GROUP: rg-cloudnest-dev

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify cleanup request
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ inputs.confirmation }}" != "DELETE-PORTFOLIO" ]]; then
            echo "ERROR: cleanup confirmation must be DELETE-PORTFOLIO."
            exit 1
          fi

          echo "Cleanup confirmation accepted."

      - name: Sign in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure identity and deployment scope
        run: ./scripts/verify-dev-azure-scope.sh

      - name: Delete CloudNest workload resources
        shell: bash
        run: |
          set -euo pipefail

          resource_group="$CLOUDNEST_DEPLOYMENT_RESOURCE_GROUP"
          mkdir -p cleanup-evidence

          az resource list             --resource-group "$resource_group"             --query "[].{name:name,type:type,id:id}"             --output json             > cleanup-evidence/resources-before.json

          before_count="$(jq 'length' cleanup-evidence/resources-before.json)"
          echo "Resources before cleanup: $before_count"

          for pass in 1 2 3 4 5; do
            mapfile -t resource_ids < <(
              az resource list                 --resource-group "$resource_group"                 --query "[].id"                 --output tsv
            )

            if (( ${#resource_ids[@]} == 0 )); then
              break
            fi

            echo "Cleanup pass $pass: ${#resource_ids[@]} resource(s)"

            for resource_id in "${resource_ids[@]}"; do
              echo "Deleting $resource_id"
              az resource delete --ids "$resource_id" --only-show-errors || true
            done

            sleep 20
          done

          az resource list             --resource-group "$resource_group"             --query "[].{name:name,type:type,id:id}"             --output json             > cleanup-evidence/resources-after.json

          remaining="$(jq 'length' cleanup-evidence/resources-after.json)"

          {
            echo "CloudNest cleanup"
            echo "Resources before cleanup: $before_count"
            echo "Remaining resources: $remaining"
          } | tee cleanup-evidence/cleanup-summary.txt

          if (( remaining != 0 )); then
            echo "ERROR: CloudNest workload resources remain after cleanup."
            jq -r '.[] | "\(.type)  \(.name)"' cleanup-evidence/resources-after.json
            exit 1
          fi

          echo "CloudNest workload cleanup verified."

      - name: Upload cleanup evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cloudnest-cleanup-${{ github.run_id }}
          path: cleanup-evidence/
          if-no-files-found: error
