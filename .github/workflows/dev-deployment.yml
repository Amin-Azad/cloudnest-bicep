name: Dev Deployment

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY-DEV to confirm deployment
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudnest-dev-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Guarded Dev Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment:
      name: dev

    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      CLOUDNEST_ACTION_GROUP_EMAIL: ${{ vars.CLOUDNEST_ACTION_GROUP_EMAIL }}
      CLOUDNEST_SQL_ADMIN_PASSWORD: ${{ secrets.CLOUDNEST_SQL_ADMIN_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify manual deployment request
        run: |
          if [[ "${{ inputs.confirmation }}" != "DEPLOY-DEV" ]]; then
            echo "ERROR: deployment confirmation must be DEPLOY-DEV."
            exit 1
          fi

          echo "Manual deployment confirmation accepted."

      - name: Install Bicep
        run: az bicep install --version v0.46.1

      - name: Sign in to Azure
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Verify Azure identity and deployment scope
        run: ./scripts/verify-dev-azure-scope.sh
      - name: Run dev readiness checks
        run: ./scripts/check-dev-readiness.sh

      - name: Verify deployment resource group
        run: |
          if ! az group show \
            --name rg-cloudnest-dev \
            --output none 2>/dev/null; then
            echo "ERROR: rg-cloudnest-dev does not exist."
            echo "Deployment scope must be prepared before deployment is enabled."
            exit 1
          fi

      - name: Deploy CloudNest dev
        run: |
          az deployment group create \
            --name "cloudnest-dev-${GITHUB_RUN_ID}" \
            --resource-group rg-cloudnest-dev \
            --template-file infra/main.bicep \
            --parameters infra/environments/dev/main.bicepparam \
            --mode Incremental
